name: secret-scan

# Secret-leak gate. This repo's working tree is auto-committed on a timer, so a
# stray dev signing key, .env, or .pem can be committed and pushed before a
# human notices. gitleaks fails the build on key headers and high-entropy
# strings. Treat origin as public regardless of actual visibility.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so pushes scan every new commit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
